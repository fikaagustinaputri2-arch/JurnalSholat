<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Sholat Harian</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1>Jurnal Sholat Harian</h1>
                <button id="dark-mode-btn" class="btn-theme" title="Ubah Tema">🌙</button>
            </div>
            <p id="current-date">Memuat tanggal...</p>
        </header>

        <div class="card summary-card">
            <h3>Progress Hari Ini</h3>
            <div class="progress-bar">
                <div id="progress-fill" style="width: 0%;"></div>
            </div>
            <span id="progress-text">0/5 Sholat Selesai</span>
        </div>

        <div class="card">
            <h2>Daftar Wajib & Sunnah</h2>
            <div id="sholat-list">
                <!-- Daftar sholat akan dirender otomatis via JavaScript -->
            </div>
        </div>

        <button id="reset-btn" class="btn-reset">Reset Data Hari Ini</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
